<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>PNP Training & Certification Registry</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>


    <!-- =====================================================
         HEADER
    ====================================================== -->

    <header>

        <div class="header-content">

            <h1>
                PNP Training & Certification Registry
            </h1>

            <p>
                Blockchain-Based Training Verification System
            </p>

        </div>


        <button
            id="connectBtn"
            class="connect-btn"
            type="button"
        >
            Connect Wallet
        </button>

    </header>



    <!-- =====================================================
         MAIN
    ====================================================== -->

    <main>


        <!-- =================================================
             CONNECTED WALLET
        ================================================== -->

        <section class="wallet-card">

            <strong>
                Connected Wallet:
            </strong>

            <span id="walletAddress">
                Not connected
            </span>

        </section>



        <!-- =================================================
             DASHBOARD
        ================================================== -->

        <section class="dashboard">


            <!-- TOTAL CERTIFICATES -->

            <div class="card">

                <h3>
                    Total Certificates
                </h3>

                <div
                    id="totalCertificates"
                    class="number"
                >
                    0
                </div>

            </div>



            <!-- NETWORK -->

            <div class="card">

                <h3>
                    Network
                </h3>

                <div
                    id="network"
                    class="network"
                >
                    Not connected
                </div>

            </div>



            <!-- SYSTEM STATUS -->

            <div class="card">

                <h3>
                    System Status
                </h3>

                <div
                    id="systemStatus"
                    class="ready"
                >
                    Waiting
                </div>

            </div>


        </section>



        <!-- =================================================
             ISSUE CERTIFICATE
        ================================================== -->

        <section class="section">

            <h2>
                Issue Training Certificate
            </h2>


            <input
                id="personnelHash"
                type="text"
                placeholder="Personnel Hash (bytes32)"
                autocomplete="off"
            >


            <input
                id="trainingTitle"
                type="text"
                placeholder="Training Title"
                autocomplete="off"
            >


            <input
                id="certificateNo"
                type="text"
                placeholder="Certificate Number"
                autocomplete="off"
            >


            <button
                id="issueBtn"
                type="button"
                onclick="issueCertificate()"
            >
                Issue Certificate
            </button>


            <p id="issueStatus"></p>

        </section>



        <!-- =================================================
             VERIFY CERTIFICATE
        ================================================== -->

        <section class="section">

            <h2>
                Verify Certificate
            </h2>


            <input
                id="verifyId"
                type="number"
                min="1"
                placeholder="Certificate ID"
            >


            <button
                id="verifyBtn"
                type="button"
                onclick="verifyCertificate()"
            >
                Verify Certificate
            </button>


            <div id="certificateResult"></div>

        </section>



        <!-- =================================================
             REVOKE CERTIFICATE
        ================================================== -->

        <section class="section">

            <h2>
                Revoke Certificate
            </h2>


            <input
                id="revokeId"
                type="number"
                min="1"
                placeholder="Certificate ID"
            >


            <button
                id="revokeBtn"
                type="button"
                onclick="revokeCertificate()"
            >
                Revoke Certificate
            </button>


            <p id="revokeStatus"></p>

        </section>


    </main>



    <!-- =====================================================
         ETHERS.JS
    ====================================================== -->

    <script
        src="https://cdn.jsdelivr.net/npm/ethers@6.14.0/dist/ethers.umd.min.js"
    ></script>


    <!-- =====================================================
         APPLICATION JAVASCRIPT
    ====================================================== -->

    <script
        src="app.js"
    ></script>


</body>

</html>
